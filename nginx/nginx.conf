user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" '
                     'status=$status bytes=$body_bytes_sent '
                     'request_id=$req_id request_time=$request_time';

    # WebSocket upgrade support (AI Assessor session stream, /api/...) - only
    # activates when the client actually sends an Upgrade header, so it's a
    # no-op for plain HTTP requests through the same location.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    access_log  /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout  65;

    # Reasonable request limits - actual authorization/validation logic
    # belongs to the services, not here.
    client_max_body_size 10m;
    large_client_header_buffers 4 16k;

    include /etc/nginx/conf.d/*.conf;
}

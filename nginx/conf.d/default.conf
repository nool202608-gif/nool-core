# Forward the client's X-Request-ID if it sent one, otherwise fall back to
# nginx's own auto-generated request id.
map $http_x_request_id $req_id {
    default   $http_x_request_id;
    ""        $request_id;
}

upstream auth_service {
    server auth:8000;
}

upstream core_service {
    server core:8000;
}

server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $req_id;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;

    # CORS foundation - tighten Access-Control-Allow-Origin per environment
    # once nool-app's origins are known. No auth logic lives here; that
    # belongs to the Auth service.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID" always;

    location /auth/ {
        if ($request_method = OPTIONS) {
            return 204;
        }
        rewrite ^/auth/(.*)$ /$1 break;
        proxy_pass http://auth_service;
    }

    location /api/ {
        if ($request_method = OPTIONS) {
            return 204;
        }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://core_service;
    }

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    error_page 502 503 504 /50x.json;
    location = /50x.json {
        internal;
        default_type application/json;
        return 502 '{"error":{"code":"BAD_GATEWAY","message":"Upstream service unavailable.","request_id":""}}';
    }
}
